    password: zxcvbnm
  developer:
    username: developer
    password: 123456

# 全局配置: 所有环境（dev、test、prod）都共享的配置
common:
  timeout: 10   # 默认等待时间 10 seconds
  test_data_dir: test_data  # 测试数据目录名称
  import_json_file: imported_file.json   # 默认导入的数据文件
  browser: chrome
  headless: false
#  headless: true    # 不打开浏览器，所有操作都在后台完成，适用于 CI/CD
  remote_url: ""  # 测试服务器地址，而不是本机，有些测试需要在远程服务器上执行，默认是空字符串，表示不使用远程服务器
  log_level: DEBUG
  log_dir: logs
  screenshot_dir: screenshots # 失败截图保存目录
