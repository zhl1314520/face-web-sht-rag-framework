[pytest]
# 测试目录
testpaths = tests

# 文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义标记
markers =
    ui: UI 自动化测试
    api: API 接口测试
    smoke: 冒烟测试
    regression: 回归测试

# 命令行默认选项
addopts =
    -v
    --alluredir=allure-results
    --clean-alluredir

# 日志配置（pytest 内置 logging）
log_cli = true
log_cli_level = INFO
log_cli_format = [%(asctime)s] [%(levelname)s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 忽略目录
norecursedirs = .venv allure-results allure-report logs screenshots
